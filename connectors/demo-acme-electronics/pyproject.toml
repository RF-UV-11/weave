[project]
name = "weave-demo-acme-electronics"
version = "0.1.0"
description = "Demo vendor: a real HTTP API simulating a business's own systems, for Weave's end-to-end demo (PLAN.md Phase 3.8)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["api", "data", "setup_weave"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

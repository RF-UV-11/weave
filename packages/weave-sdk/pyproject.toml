[project]
name = "weave"
version = "0.1.0"
description = "Weave SDK: register your business's services as tools for your Weave-hosted bot — no MCP server to build or run yourself"
requires-python = ">=3.12"
dependencies = [
  "grpcio==1.83.0",
  "protobuf>=6.33.1",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools==1.83.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
# weave/gen/** (generated protobuf/grpc stubs — see initialize.sh, not
# committed) has to be discovered dynamically rather than listed by name:
# its package tree isn't known until codegen has run. `find:` picks up
# whatever exists in the working tree at build time, which for an
# editable install (this repo's own dev flow) means every gen/ subpackage
# generated so far; a real (non-editable) build should run initialize.sh
# (or an equivalent codegen step) before `pip install`/`build` so those
# packages actually exist to be found.
where = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

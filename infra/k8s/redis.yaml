# Redis backs rate-limit counters only right now (see
# docs/architecture/SECURITY.md §5) — short-lived, TTL-bound data that's
# fine to lose on a pod restart, so this is a plain Deployment with no
# persistent volume, unlike mongo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: weave
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:7
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: weave
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

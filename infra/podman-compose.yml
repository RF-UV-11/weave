version: "3.9"

services:
  mongo:
    image: docker.io/library/mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: docker.io/qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: weave
      MINIO_ROOT_PASSWORD: weave-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    image: localhost/weave/core:latest
    build:
      context: ..
      dockerfile: infra/containerfiles/core.Containerfile
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: weave
      GRPC_ADDR: ":9090"
      # Dev-only key, generate your own with `openssl rand -base64 32` for
      # anything beyond local dev. See docs/architecture/SECURITY.md §3.
      VAULT_ROOT_KEY: "5eJ9k0h2xW1qzT7yD3mN8pR4sL6vC9bA0fG2hJ5kM8o="
      # Dev-only secret — generate your own for anything beyond local dev.
      JWT_SECRET: "dev-only-jwt-secret-do-not-use-in-prod"
      REDIS_URI: "redis://redis:6379"
      QDRANT_ADDR: "qdrant:6334"
    ports:
      - "9090:9090"
    healthcheck:
      # distroless has no shell, so this is a static Go binary
      # (grpc-health-probe) speaking the standard gRPC health protocol,
      # not a CMD-SHELL script like the other services here.
      test: ["CMD", "/grpc-health-probe", "-addr=:9090"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # grpc-web proxy (docs/architecture/ARCHITECTURE.md §4) — the browser
  # (web/) never speaks raw gRPC, only grpc-web through this. orchestrator
  # isn't containerized yet (still run via its own initialize.sh, same as
  # mcp-gateway), so envoy.yaml's "orchestrator" cluster points at
  # host.containers.internal:9091 — a real dev container reaching a
  # locally-run process, not another container on this network.
  envoy:
    image: docker.io/envoyproxy/envoy:v1.31-latest
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8090:8090"
      - "9901:9901"
    depends_on:
      core:
        condition: service_healthy
    extra_hosts:
      - "host.containers.internal:host-gateway"

volumes:
  mongo-data:
  qdrant-data:
  minio-data:

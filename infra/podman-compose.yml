version: "3.9"

services:
  mongo:
    image: docker.io/library/mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: docker.io/qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: weave
      MINIO_ROOT_PASSWORD: weave-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    image: localhost/weave/core:latest
    build:
      context: ..
      dockerfile: infra/containerfiles/core.Containerfile
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: weave
      GRPC_ADDR: ":9090"
      # Dev-only key, generate your own with `openssl rand -base64 32` for
      # anything beyond local dev. See docs/architecture/SECURITY.md §3.
      VAULT_ROOT_KEY: "5eJ9k0h2xW1qzT7yD3mN8pR4sL6vC9bA0fG2hJ5kM8o="
      # Dev-only secret — generate your own for anything beyond local dev.
      JWT_SECRET: "dev-only-jwt-secret-do-not-use-in-prod"
      REDIS_URI: "redis://redis:6379"
    ports:
      - "9090:9090"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo-data:
  qdrant-data:
  minio-data:

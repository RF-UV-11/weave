# Local dev stack. Run from repo root:
#   podman-compose -f infra/podman-compose.yml up -d
# Docker-compatible: `docker compose -f infra/podman-compose.yml up -d` also works.
version: "3.9"

services:
  mongo:
    image: docker.io/library/mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: servicesphere
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: docker.io/qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: docker.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-servicesphere}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-servicesphere-dev}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-services:
    # Pre-built image, not an inline `build:` — podman-compose 1.6.0 has a
    # real bug resolving build context/dockerfile paths on Windows (tried both
    # CWD-relative and compose-file-relative, both broke differently). Build
    # with `make build-backend-image` (or `podman build -t
    # servicesphere/backend-services -f infra/containerfiles/backend-services.Containerfile .`
    # from repo root) before `podman-compose up`.
    image: localhost/servicesphere/backend-services:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: servicesphere
      BACKEND_SERVICES_ADDR: ":8081"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  qdrant-data:
  minio-data:

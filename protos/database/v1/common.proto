syntax = "proto3";

package database.v1;

option go_package = "weave/core/gen/database/v1;databasev1";

message PageRequest {
  string page_token = 1;
  int32 page_size = 2;
}

message PageResponse {
  string next_page_token = 1;
}

message ErrorDetail {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

syntax = "proto3";

package database.v1;

option go_package = "weave/core/gen/database/v1;databasev1";

// is_collection: true
// Mongo collection "http_tools", owned by core/mongodb/http_tool.go.
//
// An HttpTool is how a business registers a plain HTTP API as a tool
// without running their own MCP server (docs/architecture/ARCHITECTURE.md
// §3's "always real MCP" decision: mcp-gateway is what turns this
// definition into genuine MCP protocol on the wire — this message is
// never itself served directly to orchestrator).
message HttpTool {
  // buf:lint:ignore FIELD_LOWER_SNAKE_CASE
  string _id = 1;
  string tenant_id = 2;
  // The tenant's single auto-created "weave_managed" Connector — see
  // core/mongodb/http_tool.go's GetOrCreateManagedConnector.
  string connector_id = 3;
  // Unique per tenant. Exposed to the LLM as the callable tool's name.
  string name = 4;
  // Mandatory — same tool-description requirement as MCP-native tools
  // (docs/architecture/ARCHITECTURE.md §3, enforced here at registration
  // rather than at manifest-refresh time since there's no real MCP
  // server whose tools/list to validate).
  string description = 5;
  string http_endpoint = 6;
  // "GET" | "POST" | "PUT" | "PATCH" | "DELETE"
  string http_method = 7;
  // JSON Schema (as a JSON-encoded string) describing the tool's
  // parameters — mirrors an MCP tool's inputSchema.
  string params_schema = 8;
  // Optional — empty if the business's endpoint needs no credential.
  // Same vault as MCP connector credentials (docs/architecture/SECURITY.md §3).
  string credential_ref_id = 9;
  string created_at = 10;
  // "internal" | "external". Defaults to "internal" (secure by default —
  // a business must explicitly opt a tool into external/customer-facing
  // use). Carried into the MCP tool descriptor's _meta by mcp-gateway
  // (mcp-gateway/gateway/tenant_server.py) so orchestrator's tool
  // assembly (orchestrator/tools/assembly.py) can filter: an external
  // bot profile only ever sees "external" tools, an internal profile
  // sees all of a tenant's tools regardless of this field.
  string visibility = 11;
  // "general" | "analytics". Defaults to "general". Lets the multi-agent
  // supervisor's router (orchestrator/server/router.py) route a turn to
  // only this tenant's analytics-flavored tools when the query is
  // analytical, instead of offering the full tool set. Also carried via
  // MCP _meta, same mechanism as visibility.
  string category = 12;
  // "" | "none" | "user_token". Defaults to "" (== "none"): the
  // long-standing behavior — credential_ref_id (if any) is sent to
  // http_endpoint as a static "Authorization: Bearer <secret>" header,
  // the same secret for every caller regardless of which end user is
  // chatting.
  //
  // "user_token" is for a tenant's endpoints that must be scoped to the
  // specific signed-in Weave user asking — a finance app's "my
  // transactions" or "my account balance", where the tenant's own
  // backend needs to know *which* of their registered users is calling,
  // not just that *some* authorized caller is. Every ChatStream turn is
  // already authenticated (there is no anonymous path in this system —
  // docs/architecture/SECURITY.md §1), so this only ever restricts a
  // tool to real, registered/signed-in Weave users, never opens one up.
  //
  // For a "user_token" tool, credential_ref_id is reinterpreted as an
  // HMAC-SHA256 *signing key* (not a bearer token — mcp-gateway/gateway/
  // tenant_server.py enforces this is set at registration time, since a
  // "user_token" tool with nothing to sign with could never be verified
  // tenant-side): orchestrator mints a short-lived signed assertion
  // ({tenant_id, user_id}, orchestrator/server/auth.py's
  // mint_user_assertion) carried via MCP's standard tools/call _meta
  // field, exactly like visibility/category travel on tools/list.
  // mcp-gateway verifies that assertion (it holds the same JWT_SECRET as
  // orchestrator — both are Weave-owned internal services, same trust
  // zone as core; this never touches a tenant's own secret), then
  // computes signature = HMAC-SHA256(credential_secret, "{tenant_id}:
  // {user_id}") and sends it to the tenant's http_endpoint as
  // X-Weave-User-Id / X-Weave-Tenant-Id / X-Weave-User-Signature headers
  // — the tenant's own API verifies that signature with the same shared
  // secret it registered (the same webhook-signing-secret pattern
  // Stripe/GitHub use for verifying inbound requests), then scopes its
  // response to that verified user_id however it maps Weave users to its
  // own user records. Weave never sees or needs to know the tenant's
  // own user-identity scheme.
  string auth_mode = 13;
}

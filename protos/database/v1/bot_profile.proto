syntax = "proto3";

package database.v1;

import "database/v1/auth.proto";

option go_package = "weave/core/gen/database/v1;databasev1";

// is_collection: true
// Mongo collection "bot_profiles", owned by core/mongodb/bot_profile.go.
message BotProfile {
  // buf:lint:ignore FIELD_LOWER_SNAKE_CASE
  string _id = 1;
  string tenant_id = 2;
  // Unique per tenant, e.g. "external", "internal".
  string name = 3;
  // This bot's system prompt, in full — the literal text sent to the
  // model as the "system" message every turn (orchestrator/server/
  // chat_service.py's _build_system_prompt), not a path or a reference to
  // one: orchestrator never reads tenant-owned files, so there's nothing
  // on its side that could resolve a path like "personas/external.md"
  // into anything. A business writes this per bot profile (one tenant
  // commonly has more than one — see `name`) to describe that bot's
  // persona, tone, and task scope, e.g. "You are Tarang Electronics'
  // customer-support assistant. Be concise, always cite the order ID you
  // looked up, and never guess at a status you didn't get from a tool."
  // Falls back to a generic default when left "" — a tenant that hasn't
  // written one yet still gets a working assistant.
  string persona = 4;
  repeated string connector_ids = 5;
  repeated string channels = 6;
  repeated Role roles_allowed = 7;
  string created_at = 8;
  // "internal" | "external". An external profile gets guardrail
  // enforcement (docs/architecture/SECURITY.md §6); internal profiles
  // (staff-facing) don't — the tradeoff is deliberate, not an oversight:
  // guardrail screening buffers the full answer instead of streaming it
  // token-by-token (see orchestrator/server/guardrails.py), so it only
  // applies where the disclosure risk justifies the latency cost.
  string visibility = 9;
  // Free-text rules the business doesn't want disclosed, e.g. "Never
  // reveal internal SKU codes or supplier names." Only enforced when
  // visibility == "external". Checked against both the final answer and
  // any tool result before it enters the model's context.
  repeated string guardrails = 10;
  // Vendor-controlled toggle: whether this bot profile may fall back to
  // the built-in web-search tool when a turn doesn't match its registered
  // tools. Defaults to false — a business must opt in, since web search
  // sends the user's message to a public search engine, out of scope of
  // this tenant's own systems.
  bool web_search_enabled = 11;
  // Which LLM backend this bot profile's turns are generated on:
  // "" (default) | "ollama" | "openai". "" and "ollama" behave
  // identically — orchestrator's local model, per OLLAMA_MODEL/
  // OLLAMA_HOST — so a profile predating this field, or one that never
  // set it, keeps working exactly as before. "openai" routes through
  // orchestrator/llm/openai_compat_client.py, which speaks the OpenAI
  // chat-completions wire format — this covers OpenAI itself and any
  // other provider exposing that same API shape (Azure OpenAI, Groq, a
  // self-hosted vLLM/LM Studio server, etc.), selected by *where*
  // OPENAI_BASE_URL points, not by a separate provider string per
  // vendor. orchestrator holds the credentials for whichever backends
  // it's configured for (env vars, same trust boundary as
  // OLLAMA_HOST/OLLAMA_MODEL) — a bot profile picks which configured
  // backend to use, it doesn't carry its own API key (that would need
  // per-tenant credential-vault integration, tracked as real future
  // work in ARCHITECTURE.md §3, not implemented here).
  string llm_provider = 12;
  // The model name/id to request from whichever llm_provider resolves
  // to, e.g. "llama3.2:3b" (ollama) or "gpt-4o-mini" (openai). Falls
  // back to that provider's own default env var
  // (OLLAMA_MODEL/OPENAI_MODEL) when left "".
  string llm_model = 13;
}

syntax = "proto3";

package database.v1;

option go_package = "weave/core/gen/database/v1;databasev1";

// is_collection: true
// Mongo collection "credentials", owned by core/mongodb/credential.go.
//
// Never holds a plaintext secret. `ciphertext` is the secret encrypted with
// a per-credential data key (DEK); `wrapped_dek` is that DEK encrypted with
// the vault root key. See docs/architecture/SECURITY.md §3.
message CredentialRef {
  // buf:lint:ignore FIELD_LOWER_SNAKE_CASE
  string _id = 1;
  string tenant_id = 2;
  string connector_id = 3;
  bytes ciphertext = 4;
  bytes nonce = 5;
  bytes wrapped_dek = 6;
  bytes dek_nonce = 7;
  string created_at = 8;
}

syntax = "proto3";

package orchestrator.v1;

option go_package = "weave/core/gen/orchestrator/v1;orchestratorv1";

// One piece of non-text input attached to a turn (image/audio/video/PDF).
// orchestrator never stores these — each is processed once, inline,
// during that turn's ChatStream call (orchestrator/attachments/process.py)
// and discarded: an image's bytes are forwarded to a vision-capable model
// for that turn only, everything else (PDF, audio, video) is reduced to
// extracted/transcribed text appended to the turn's message before either
// touches the model's context. A large upload is the caller's problem to
// size-limit before sending, same as any other unary gRPC field.
message Attachment {
  bytes data = 1;
  // IANA media type, e.g. "image/jpeg", "application/pdf", "audio/ogg",
  // "video/mp4" — selects which branch of attachments/process.py handles
  // this attachment; an unrecognized type is dropped with a warning
  // rather than failing the whole turn.
  string mime_type = 2;
  // Original filename, if any — carried through into the extracted-text
  // note for multi-attachment turns ("[Attached: statement.pdf]") so the
  // model can refer to a specific attachment when more than one was sent.
  string filename = 3;
}

message ChatStreamRequest {
  string channel = 1;
  string message = 2;
  // Continues an existing conversation; empty starts a new one. Backed
  // by core's ChatService (docs/architecture/ARCHITECTURE.md §5) — an
  // empty value creates a fresh session server-side, whose id comes back
  // in ChatStreamResponse.session_id for the caller to send on the next
  // turn.
  string session_id = 3;
  // Optional non-text input for this turn — see Attachment above. Empty
  // for a plain text turn, which is every turn today; existing callers
  // need no changes.
  repeated Attachment attachments = 4;
}

message ChatStreamResponse {
  // A chunk of the assistant's streamed answer. Concatenate in order.
  string token = 1;
  // Set only on the final message of the stream.
  bool done = 2;
  string session_id = 3;
  // Set when a tool was called to produce this answer — which connector
  // and tool, for traceability (docs/architecture/SECURITY.md §7).
  string tool_used = 4;
  string connector_used = 5;
}

service ChatService {
  // Server-streaming: the caller's tenant/role is resolved from the JWT
  // carried in gRPC metadata (authorization: Bearer <token>), same as
  // every authenticated RPC on core — never a client-supplied tenant_id.
  rpc ChatStream(ChatStreamRequest) returns (stream ChatStreamResponse);
}

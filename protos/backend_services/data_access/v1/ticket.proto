syntax = "proto3";

package backend_services.data_access.v1;

option go_package = "servicesphere/backend-services/gen/backend_services/data_access/v1;dataaccessv1";

import "database/v1/common.proto";

enum TicketPriority {
  TICKET_PRIORITY_UNSPECIFIED = 0;
  TICKET_PRIORITY_LOW = 1;
  TICKET_PRIORITY_MEDIUM = 2;
  TICKET_PRIORITY_HIGH = 3;
  TICKET_PRIORITY_URGENT = 4;
}

enum TicketStatus {
  TICKET_STATUS_UNSPECIFIED = 0;
  TICKET_STATUS_OPEN = 1;
  TICKET_STATUS_IN_PROGRESS = 2;
  TICKET_STATUS_CLOSED = 3;
}

message Ticket {
  string id = 1;
  string tenant_id = 2;
  string customer_id = 3;
  string subject = 4;
  string description = 5;
  TicketPriority priority = 6;
  TicketStatus status = 7;
  string sla_due_at = 8;   // RFC3339
  string created_at = 9;   // RFC3339
}

message CreateTicketRequest {
  string tenant_id = 1;
  string customer_id = 2;
  string subject = 3;
  string description = 4;
  TicketPriority priority = 5;
  string idempotency_key = 6;
}

message CreateTicketResponse {
  Ticket ticket = 1;
}

message GetTicketRequest {
  string tenant_id = 1;
  string id = 2;
}

message GetTicketResponse {
  Ticket ticket = 1;
}

message ListTicketsRequest {
  string tenant_id = 1;
  string customer_id = 2; // optional filter
  database.v1.PageRequest page = 3;
}

message ListTicketsResponse {
  repeated Ticket tickets = 1;
  database.v1.PageResponse page = 2;
}

service TicketService {
  rpc CreateTicket(CreateTicketRequest) returns (CreateTicketResponse);
  rpc GetTicket(GetTicketRequest) returns (GetTicketResponse);
  rpc ListTickets(ListTicketsRequest) returns (ListTicketsResponse);
}

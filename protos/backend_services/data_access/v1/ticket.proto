syntax = "proto3";

package backend_services.data_access.v1;

option go_package = "servicesphere/backend-services/gen/backend_services/data_access/v1;dataaccessv1";

import "database/v1/common.proto";
import "database/v1/ticket.proto";

// RPC contract only — the Ticket entity schema itself lives in
// protos/database/v1/ticket.proto (see CLAUDE.md: "protos/database holds every
// collection-backed schema; data_access protos hold only RPC request/response").

message CreateTicketRequest {
  string tenant_id = 1;
  string customer_id = 2;
  string subject = 3;
  string description = 4;
  database.v1.TicketPriority priority = 5;
  string idempotency_key = 6;
}

message CreateTicketResponse {
  database.v1.Ticket ticket = 1;
}

message GetTicketRequest {
  string tenant_id = 1;
  string id = 2;
}

message GetTicketResponse {
  database.v1.Ticket ticket = 1;
}

message ListTicketsRequest {
  string tenant_id = 1;
  string customer_id = 2; // optional filter
  database.v1.PageRequest page = 3;
}

message ListTicketsResponse {
  repeated database.v1.Ticket tickets = 1;
  database.v1.PageResponse page = 2;
}

service TicketService {
  rpc CreateTicket(CreateTicketRequest) returns (CreateTicketResponse);
  rpc GetTicket(GetTicketRequest) returns (GetTicketResponse);
  rpc ListTickets(ListTicketsRequest) returns (ListTicketsResponse);
}

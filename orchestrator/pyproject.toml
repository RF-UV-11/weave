[project]
name = "weave-orchestrator"
version = "0.1.0"
description = "Weave orchestrator: chat gRPC server, LangGraph planner/agent, MCP client, dynamic tool assembly"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.83.0",
  "protobuf>=6.33.1",
  "langgraph>=0.2.0",
  "mcp>=1.2.0",
  "ollama>=0.4.0",
  "pyjwt>=2.9.0",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.83.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["server", "llm", "mcp_client", "tools"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

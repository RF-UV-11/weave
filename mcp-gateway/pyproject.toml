[project]
name = "weave-mcp-gateway"
version = "0.1.0"
description = "Turns a business's registered HTTP tools (core.HttpTool) into a real MCP server, per tenant, dynamically"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.0.0",
  "httpx>=0.27.0",
  "uvicorn>=0.27.0",
  "grpcio>=1.83.0",
  "protobuf>=6.33.1",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.83.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["gateway"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
